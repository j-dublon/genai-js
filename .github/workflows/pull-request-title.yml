name: "Pull Request Title"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions: write-all

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
